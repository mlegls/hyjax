[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyjax"
version = "0.1.0"
authors = [
  { name = "疒奀", email = "yz@mmon.co" },
]
description = "Hy bindings for JAX"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "hy>=1.0.0",
    "hyrule>=1.0.0",
    "jax>=0.4.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/mlegls/hyjax"
"Bug Tracker" = "https://github.com/mlegls/hyjax/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hyjax"]

[tool.hatch.build.targets.wheel.force-include]
"src/hyjax/__init__.hy" = "hyjax/__init__.hy"

[tool.hatch.build.targets.sdist]
include = ["src/hyjax", "examples", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Hy test files don't match python_files (*.py), but tests/conftest.py
# registers a pytest_collect_file hook that collects test_*.hy files.
python_files = ["test_*.py", "test_*.hy"]
# Disable assertion rewriting: pytest's rewriter parses sources as Python
# AST, which fails on .hy files. Hy's (assert ...) compiles to a plain
# Python assert, which is perfectly readable on failure.
addopts = "--assert=plain"
